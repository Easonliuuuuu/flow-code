name: Live Integration

# Separate from ci.yml on purpose: this job makes real calls to the Claude
# Agent SDK (cost + latency + external-service variance), so it must never
# block the fast, always-required lint/typecheck/test gate. Runs nightly
# rather than on every push to main — a real-API suite doesn't need to gate
# every commit, and a previous version of this suite ran on every push
# against a different provider and failed the large majority of the time
# against that provider's rate limiting. Use workflow_dispatch to run it on
# demand against a branch.
#
# Named for what it is (a live-API suite) rather than which provider it
# currently exercises — Claude today, the same slot a second provider's live
# suite would occupy later, run separately rather than folded into this file.
on:
  schedule:
    - cron: '0 9 * * *' # nightly, 09:00 UTC
  workflow_dispatch: {}

jobs:
  # `secrets` isn't a valid `if:` context (GitHub Actions rejects the
  # expression outright — confirmed by trying it), so presence has to be
  # checked in a step and passed to the next job via an output instead.
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        run: echo "has_key=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  integration:
    needs: check-secret
    runs-on: ubuntu-latest
    # Skips cleanly (not "fails") when the secret isn't configured, e.g.
    # before CLAUDE_CODE_OAUTH_TOKEN is added to this repo's secrets.
    if: needs.check-secret.outputs.has_key == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
