name: Release

# release-please watches every push to main, parses conventional commits, and
# keeps a "release PR" up to date with the next version bump + generated
# CHANGELOG. Merging that PR is the release decision: this workflow then
# creates the GitHub Release + tag and the publish job runs off that.
#
# Config: release-please-config.json (release-type, bootstrap point) and
# .release-please-manifest.json (current version per package path).
#
# Auth is npm trusted publishing (OIDC) — there is no NPM_TOKEN secret to leak
# or rotate, and npm attaches a provenance attestation to the release
# automatically. Setup is a one-time step in the package settings on npmjs.com;
# the `workflow_filename` registered there must stay `release.yml` (npm matches
# it exactly, case-sensitively) or publishes start failing with an auth error.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm's OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Node 22.14+ and npm 11.5.1+ are the floor for OIDC trusted publishing.
      # The package itself supports Node >=20 — that's what ci.yml tests on;
      # this pin is only about the publishing toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm install -g npm@latest

      - run: npm ci

      # Same gate as ci.yml. release-please only commits a version bump, so
      # re-run the checks against the actual release commit rather than
      # assuming they still pass.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # `npm ci` already ran `prepare` (which builds), and `npm publish` runs it
      # again — building twice is cheap and keeps this correct if either side
      # changes.
      - run: npm publish
