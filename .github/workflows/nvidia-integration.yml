name: NVIDIA Integration

# Separate from ci.yml on purpose: this job makes real calls to NVIDIA's NIM
# API (cost + latency + external-service flakiness), so it must never block
# the fast, always-required lint/typecheck/test gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  integration:
    runs-on: ubuntu-latest
    # Skips cleanly (not "fails") when the secret isn't configured — e.g. a
    # fork PR, or before NVIDIA_API_KEY is added to this repo's secrets.
    if: ${{ secrets.NVIDIA_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
