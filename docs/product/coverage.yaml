# The ledger. This is the only file the drift check reads for intent — every
# other input it uses (git history, openspec/, src/) is a fact it derives.
#
# It answers four questions:
#   1. Which capability spec owns a given commit scope, and a given src module?
#   2. Which business requirement does a given capability serve? (the BR -> ER
#      edge — the chain is BR -> capability -> Requirement/Scenario in that
#      capability's spec.md, and OpenSpec changes/tasks are the execution
#      record for BR -> capability work that needed planning first.) The check
#      walks this edge both ways: a capability no BR claims is drift, and a BR
#      nothing at all is attached to is a requirement nobody is serving.
#   3. Which OpenSpec change serves which business requirement?
#   4. Which known gaps have you already looked at and accepted?
#
# The point of (4) is the ratchet: registered gaps are debt you have seen and
# decided about, so they stay green. Anything unregistered fails the check. That
# way `npm run status:check` can go into CI today without a cleanup sprint, and
# still catches the next feature that ships without a spec.
#
# Run `npm run status` after editing.

# Commit scopes, as used in conventional-commit subjects: feat(<scope>): ...
# A feat commit whose scope is not listed here — and not registered as a gap —
# is a feature that shipped without anyone deciding where it belongs.
scopes:
  engine: [workflow-graph, agent-execution]
  workflow: [workflow-graph]
  graph: [workflow-graph]
  registry: [workflow-graph, node-skills, test-command-discovery]
  harness: [agent-execution, node-subagents]
  executors: [agent-execution]
  providers: [agent-execution, node-model-selection]
  model: [node-model-selection]
  skills: [node-skills]
  test: [test-command-discovery]
  gate: [approval-gate]
  approval: [approval-gate]
  approval-gate: [approval-gate]
  worktrees: [worktree-agent-node]
  worktree: [worktree-agent-node]
  discuss: [agent-execution, node-model-selection]
  git-ops: [agent-execution]
  plan: [workflow-graph, agent-execution]
  preflight: [agent-execution]
  schema: [workflow-graph]
  ui: [terminal-canvas-ui]
  canvas: [terminal-canvas-ui]
  splash: [terminal-canvas-ui]
  App.tsx: [terminal-canvas-ui]   # historical; prefer `ui` for new commits
  cli: [workflow-graph]
  cli.ts: [workflow-graph, agent-execution]   # historical; prefer `cli`
  init: [workflow-graph]
  presets: [workflow-graph]
  presets.ts: [workflow-graph]   # a preset is a scaffolded graph and nothing more
  validate: [workflow-graph]
  record: [run-state, workflow-graph]
  runstate: [run-state]
  connect: [session-status-line]
  notify: [approval-gate, terminal-canvas-ui]
  status: [project-documentation]   # scripts/status.mjs and the STATUS.md rollup
  guest: [guest-run-reporting, guest-agent-instructions, host-session-harness, run-state-reconciliation]
  demo: [first-run-demo]
  try: [first-run-demo]

# Top-level modules under src/ — directories and single-file modules alike, so
# a feature that ships as one .ts file cannot slip past. `index.ts` is skipped
# as a barrel. A module with no owning capability is code whose behaviour is not
# described anywhere.
modules:
  engine: [workflow-graph, agent-execution]
  capabilities: [agent-execution]
  defaultWorkflow: [workflow-graph]
  cli: [workflow-graph]
  executors: [agent-execution]
  harness: [agent-execution, node-subagents]
  registry: [workflow-graph, node-skills, test-command-discovery]
  workflow: [workflow-graph]
  worktrees: [worktree-agent-node]
  skills: [node-skills]
  ui: [terminal-canvas-ui]
  git: [approval-gate]
  init: [workflow-graph, test-command-discovery]
  presets: [workflow-graph]
  notify: [approval-gate, terminal-canvas-ui]
  runstate: [run-state]
  guest: [guest-run-reporting, guest-agent-instructions, host-session-harness, run-state-reconciliation]
  demo: [first-run-demo]

# Which BR each capability serves — the BR -> ER edge. Exactly one BR per
# capability (a strict tree, not many-to-many): if a capability's own purpose
# spans more than one BR, that is usually a sign it should split, not that this
# map should hold a list. A capability missing here is either unmapped drift
# (fix it) or a registered gap (the roadmap doesn't name a BR for it yet).
#
# This is what lets a standalone small feature — like `presets` above, which
# has no OpenSpec change of its own — still trace to product intent: it maps to
# workflow-graph, and workflow-graph maps to BR-08, so the BR link is inherited
# rather than re-declared per feature.
#
# Three judgment calls worth knowing about, all recorded rather than smoothed:
#
# 1. BR-08 owns six capabilities as of `plan-node`, past the five this file
#    used to call the top of the healthy range. Held here anyway because "the
#    graph is the authority on what executes" is exactly plan-node's own job —
#    it is what produces the graph the rest of BR-08 executes, not a
#    tangential feature that happened to land nearby. If BR-08 ever splits,
#    plan-node goes with "the graph is the truth" (workflow-graph,
#    agent-execution, node-model-selection, test-command-discovery), not with
#    "nothing escapes the gate" (approval-gate) — see call 2.
# 2. BR-08 owns five capabilities, which is the top of the healthy range — one
#    more and the label is probably a bucket. It holds here because "the graph
#    is the authority on what executes" genuinely covers all five. The seam to
#    watch, if it ever needs splitting, is between "the graph is the truth" and
#    "nothing escapes the gate" (approval-gate).
# 3. terminal-canvas-ui maps to BR-09 (a run is legible), not BR-05 (a big
#    graph stays navigable), because the spec is mostly cards, panels, and the
#    detail view rather than navigation. BR-05 therefore has no capability yet:
#    it needs the navigation half of this spec split out, which is deferred ER
#    work, not a missing mapping.
capabilities:
  workflow-graph: BR-08
  agent-execution: BR-08
  approval-gate: BR-08
  node-model-selection: BR-08
  test-command-discovery: BR-08
  # Not yet a real spec directory — openspec/changes/agent-generated-graphs is
  # still open. Registered now so the BR home is decided before archival, the
  # same way the `changes:` entry below is, rather than left for whoever
  # archives it to guess.
  plan-node: BR-08
  terminal-canvas-ui: BR-09
  run-state: BR-04
  node-skills: BR-07
  node-subagents: BR-07
  worktree-agent-node: BR-07
  ci-pipeline: BR-02
  project-documentation: BR-02
  mcp-driver-connector: BR-06
  # The guest surface, landed by add-guest-mode-reporter. Four capabilities
  # rather than one because they are independently true: reporting is a
  # contract an outside process writes against, instructions are what that
  # process is told, enforcement is what holds regardless of what it was told,
  # and reconciliation is the check that none of the first three are lying.
  guest-run-reporting: BR-06
  guest-agent-instructions: BR-06
  host-session-harness: BR-06
  run-state-reconciliation: BR-06
  # Reading a live run from a process that is not driving it — BR-03's outcome,
  # not BR-09's. terminal-canvas-ui keeps "legible on one screen"; this owns
  # "visible from somewhere flow-code does not own."
  session-status-line: BR-03
  # The first thing a stranger can see without committing anything — BR-01's
  # own outcome, which nothing owned before this. Deliberately not folded into
  # workflow-graph: `init` and the scaffold are specified there because they
  # are about the graph, and that is exactly why GAP-10 (now closed) said
  # nothing was about the stranger.
  first-run-demo: BR-01

# OpenSpec changes in openspec/changes/, mapped to the business requirement they
# serve. `status: parked` means deliberately not scheduled — it silences the
# staleness warning, which is the whole reason to record it.
changes:
  agent-generated-graphs:
    br: BR-08
    note: >-
      A `plan` node — interactive, read-only, like Discuss — negotiates the
      graph itself before a run executes it, rather than only what the graph
      builds. Does not complete until the user accepts a proposal; an
      accepted proposal is spliced in and validated through the same checks
      a hand-written file passes, including a new structural invariant this
      change also adds: every node holding `git-write` must be dominated by
      an Approval-Gate (not merely have one somewhere upstream), with no
      opt-out. `flow-code init --preset planned` scaffolds the spine
      (`plan → gate → git-ops`); a run that expands can keep the negotiated
      shape as an ordinary static file, needing no further planning.
      Engine-, runstate-, and workflow-level mechanics are implemented and
      tested (1075 tests, including a real end-to-end run with a real git
      commit); not yet done: focus preservation and viewport panning across
      an expansion have no dedicated tests, and none of this has been driven
      by hand in a real terminal against a real agent session.

  add-mcp-driver-connector:
    br: BR-06
    status: parked
    note: >-
      Blocked on M2, same reasoning as add-guest-mode-reporter — a second entry
      point into the engine before driver mode is proven under real conditions.
      No longer the adoption path: a host-session user driving it pays for a
      nested agent session inheriting none of their configuration. It keeps
      what only it can do — per-node models, worktree fan-out, unattended runs.

# Archived changes, mapped to the BR they closed. Used for the milestone rollup.
# Every archive must be here. An unmapped one fails the check, because it does
# not render as a gap — it drops out of its BR table entirely while `Shipped`
# keeps counting it, so the totals and the tables disagree and nothing says why.
# Archiving renames the directory, so the usual cause is an entry left behind in
# `changes:` under the pre-archive name; move it, do not copy it. If an archive
# ever genuinely cannot be attributed, `registered_gaps` below is the escape
# hatch — that is a decision to record, not a check to switch off.
#
# One BR per change, same as capabilities. Several of these archives predate the
# roadmap and delivered across more than one requirement; each is attributed to
# the one it mostly served, so the rollup is a fair approximation rather than a
# precise claim. The two that span:
#   - add-core-workflow-engine also built the canvas (BR-09).
#   - node-skills-and-test-discovery also built test discovery (BR-08).
#
# The date prefix is when a change was archived, not when it shipped.
# wire-up-cicd-and-readme landed on 2026-08-02 and sat open until 2026-08-08 —
# the six-day gap is the blind spot that prompted this archive, kept visible
# rather than backdated away.
archived:
  2026-08-02-add-core-workflow-engine: BR-08
  2026-08-02-add-iterative-control-flow: BR-08
  2026-08-02-add-nvidia-session-runner: BR-08
  2026-08-02-add-per-node-model-picker: BR-08
  2026-08-03-node-skills-and-test-discovery: BR-07
  2026-08-06-node-subagents: BR-07
  2026-08-08-wire-up-cicd-and-readme: BR-02
  2026-08-09-add-workflow-validation-and-recorded-graph: BR-04
  # Attributed to BR-08 — most of it is the graph and how a run picks one —
  # though the `watch` half also serves BR-03. This is the archive that proved
  # the guard: it sat unattributed and invisible in BR-08's table until the
  # check that flags it was written.
  2026-08-10-add-per-task-workflow-graphs: BR-08
  2026-08-11-add-session-status-line: BR-03
  2026-08-11-add-run-state-ownership: BR-04
  2026-08-17-route-rejected-gate-to-revision: BR-08
  # Spec correction, no behaviour change: "Edges carry no behavior" forbade the
  # `when:` the loader has accepted since edge conditions shipped. The rule was
  # mis-stated rather than changed — an edge may route, only a node type may
  # judge — and the second half is untouched.
  2026-08-17-correct-edge-routing-requirement: BR-08
  # The guard that makes this map self-enforcing: an archive missing from here
  # now fails the check instead of vanishing from its BR table. It caught
  # add-per-task-workflow-graphs on its first run, unattributed since 2026-08-10.
  2026-08-17-flag-unattributed-archives: BR-02
  # The guest surface in three parts: reporting (guest-run-reporting,
  # guest-agent-instructions), enforcement (host-session-harness), and
  # reconciliation (run-state-reconciliation). Unparked once
  # add-run-state-ownership gave a run document one owner, which is what a
  # second writer needed to exist safely. Closes GAP-13 and GAP-14.
  2026-08-17-add-guest-mode-reporter: BR-06
  # Extends the same "nothing reaches without explicit approval" guarantee
  # BR-08 already claims for git-ops one step earlier: the spec Validate later
  # checks the run against is now itself gated, with a bare `loopback: true`
  # back to Discuss on rejection — the mechanism 2026-08-17-route-rejected-
  # gate-to-revision documented for the final gate, now used directly.
  2026-08-22-add-spec-approval-gate: BR-08
  # `flow-code try` — a complete run of the real default graph against a
  # seeded temporary repository, with no repository, configuration, or
  # credential required, and the model replaced by a script that writes
  # the files a real agent would have written. The test fails once and
  # recovers through the loop-back; both gates pause and hold a diff
  # computed from real git. A persistent header banner discloses that
  # nothing live is running. The first work attached to BR-01, and closes
  # GAP-10.
  2026-08-23-add-first-run-demo: BR-01

# Known, accepted drift. Each entry needs a reason and something tracking it —
# a BR or a line in inbox.md. An entry with neither is just a silenced alarm.
registered_gaps:
  - id: GAP-01
    kind: scope
    subject: watch
    reason: >-
      `flow-code watch` shipped as a full user-facing command with no capability
      spec. Flagged in the guest-mode proposal's Impact section but never
      tracked anywhere that looks. `add-per-task-workflow-graphs` changed what
      `watch` renders — the run's own recorded graph, never
      `workflow.yaml` — but that is run-state spec surface, not a spec for the
      command itself. Re-evaluated on that change's own design.md question and
      left open on purpose: still nothing describes how `watch` attaches, pins
      to a run id, refuses writes, or reports liveness.
    tracked_by: BR-03

  - id: GAP-06
    kind: scope
    subject: nvidia-integration.yml
    reason: >-
      Not a product feature — a CI workflow change typed as `feat` with a
      filename as its scope. Registered rather than mapped, because inventing a
      capability to own a CI file would be the ledger lying to keep itself
      green. Nothing to fix in the code; the commit is already written. This is
      a permanent registration, not a pending decision — there is no future
      state where this becomes a spec.
    tracked_by: closed — non-issue

  - id: GAP-12
    kind: scope
    subject: testbed
    reason: >-
      Not a product feature — the `testbed` skill under `.claude/skills/`
      generates a disposable local repo for driving the TUI by hand during
      development. Registered rather than mapped, because inventing a
      capability to own a dev-only test scaffold would be the ledger lying to
      keep itself green. This is a permanent registration, not a pending
      decision — there is no future state where this becomes a spec.
    tracked_by: closed — non-issue

  # GAP-10 (BR-01) is closed: first-run-demo archived 2026-08-23 and is about
  # the outcome directly, not described in pieces inside a capability that is
  # about something else — see the archived: comment above. GAP-11 comes from
  # the same reverse edge and is not: a real surface exists (terminal-canvas-ui's
  # navigation half) but no spec is about it yet. ER work, not code drift.
  - id: GAP-11
    kind: br
    subject: BR-05
    reason: >-
      Needs the navigation half of terminal-canvas-ui — viewport, pan, collapse,
      off-screen indication — split into its own capability. terminal-canvas-ui
      maps to BR-09 because it is mostly cards, panels, and the detail view;
      splitting it is deferred ER work rather than a missing mapping.
    tracked_by: inbox

  # GAP-02 and GAP-05 (module and scope `runstate`) are closed. Both said the
  # same thing from two directions: src/runstate/ had no owning capability spec
  # while watch and guest mode both depended on it. `run-state` now owns the
  # module and the scope, and specifies what a run records about itself and who
  # may write it — which was the "ownership is incidental rather than
  # specified" half of GAP-02 exactly.
  #
  # GAP-01 (scope `watch`) deliberately stays open past that archive. A spec
  # for the run document is not a spec for the command that reads it: how
  # `watch` attaches, pins to a run id, refuses writes, and reports liveness is
  # still described nowhere. Closing it alongside GAP-02/05 would be the ledger
  # flattering itself.

  # GAP-07/08/09 (capabilities node-skills, node-subagents, worktree-agent-node)
  # are closed. They were shipped, spec'd work that no BR claimed; BR-07 now
  # names the outcome all three serve, so they are mapped above rather than
  # registered. That is the intended lifecycle of a gap: it gets resolved, not
  # renewed.

# How old an active change may get, in days, before the check calls it stale.
# Parked changes are exempt.
staleness_days: 30
